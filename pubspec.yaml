
name: reuse_marketplace
description: ReUse Marketplace Flutter application
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # UI and navigation
  google_fonts: ^6.2.1
  material_ui: ^1.11.1
  cupertino_icons: ^1.0.8
  go_router: ^18.1.4

  # Firebase
  firebase_core: ^5.2.0
  firebase_auth: ^7.1.0
  cloud_firestore: ^7.2.0
  google_sign_in: ^7.2.0

  # State management
  flutter_riverpod: ^3.5.0

  # Supabase Storage 
  supabase_flutter: ^2.18.3
  

  # Image selection
  image_picker: ^1.1.2
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/welcome/
    - assets/images/categories/
